[package]
name = "yilian-backend"
version = "1.1.0-rc.1"
edition = "2021"
# Application-internal crate: nothing in this repository runs `cargo publish`,
# and no third party consumes `yilian_backend` as a library. See
# docs/architecture/public-api-policy.md — the supported contracts are the
# REST / command / event / projection surfaces, not Rust module paths.
publish = false

[lib]
name = "yilian_backend"
path = "src/lib.rs"

[[bin]]
name = "yilian-server"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Database
# Note: "backup" feature enabled for SQLite online backup API to quarantine legacy DB safely
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# HTTP client (for LLM calls)
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
url = "2"
pdf-extract = "=0.12.0"
calamine = { version = "=0.36.1", default-features = false }
quick-xml = "=0.41.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
open = { version = "5.4", features = ["shellexecute-on-windows"] }

# Async utilities
futures = "0.3"
async-stream = "0.3"
tokio-util = "0.7"
async-trait = "0.1"
parking_lot = "0.12"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
glob = "0.3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

# Secret storage
keyring = "4"
secrecy = "0.10"

# Cross-platform desktop capability dependencies.
# These are consumed by code that is compiled on Windows, macOS and Linux;
# keeping them in the Windows-only section below made the macOS build fail
# with unresolved `enigo`, `xcap`, `image`, `base64` and `sysinfo` imports.

# Input simulation (mouse + keyboard)
enigo = { version = "0.3", features = ["serde"] }

# Screenshot
xcap = "0.3"

# Image encoding for screenshot and rendered deliverables (PNG/JPEG)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Base64 encoding
base64 = "0.22"

# System information
sysinfo = "0.31"

# Windows OS-assisted process isolation (privilege-reduced token + Job Object)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
] }
